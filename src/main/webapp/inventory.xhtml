<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">

        <section class="card">
            <h2>Aktueller Lagerbestand</h2>

            <h:dataTable value="#{articleBean.articles}" var="article" styleClass="data-table">

                <h:column>
                    <f:facet name="header">Artikel</f:facet>
                    #{article.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Artikelnummer</f:facet>
                    #{article.articleNumber}
                </h:column>

                <h:column>
                    <f:facet name="header">Bestand</f:facet>
                    #{article.stock}
                </h:column>

                <h:column>
                    <f:facet name="header">Mindestbestand</f:facet>
                    #{article.minStock}
                </h:column>

            </h:dataTable>

        </section>

    </ui:define>
</ui:composition>
