<ui:composition template="/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="content">

        <section class="card">
            <h2>Aktueller Lagerbestand</h2>

            <!-- Mindestbestand-Warnung -->
            <h:panelGroup rendered="#{articleBean.lowStockCount gt 0}">
                <div class="warning-box">
                    ⚠ Achtung: Es gibt #{articleBean.lowStockCount} Artikel unter Mindestbestand.
                </div>
                <br/>
            </h:panelGroup>

            <h:dataTable value="#{articleBean.articles}" var="article" styleClass="data-table">

                <h:column>
                    <f:facet name="header">Artikel</f:facet>
                    #{article.name}
                </h:column>

                <h:column>
                    <f:facet name="header">Artikelnummer</f:facet>
                    #{article.articleNumber}
                </h:column>

                <h:column>
                    <f:facet name="header">Bestand</f:facet>
                    #{article.stock}
                </h:column>

                <h:column>
                    <f:facet name="header">Mindestbestand</f:facet>
                    #{article.minStock}
                </h:column>

                <h:column>
                    <f:facet name="header">Status</f:facet>

                    <h:panelGroup rendered="#{articleBean.belowMinimum(article)}">
                        <span class="status-warning">⚠ Mindestbestand unterschritten</span>
                    </h:panelGroup>

                    <h:panelGroup rendered="#{not articleBean.belowMinimum(article)}">
                        <span class="status-ok">OK</span>
                    </h:panelGroup>
                </h:column>

            </h:dataTable>

        </section>

    </ui:define>
</ui:composition>
